# Local development dependencies: PostgreSQL + Azurite (Blob/Queue emulator).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goformosaic
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck
    ports: ["10000:10000", "10001:10001", "10002:10002"]
volumes:
  pgdata:
